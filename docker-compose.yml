  # Legacy admin service (commented out - uncomment if needed)
  admin:
    build:
      context: ${ADMIN_SOURCE_LOCATION}/.
      dockerfile: ../Dockerize-Laravue/Dockerfile.admin
    container_name: ${ADMIN_CONTAINER}
    ports:
      - "81:80"
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ${ADMIN_SOURCE_LOCATION}:/var/www/html
      - admin_vendor_cache:/var/www/html/vendor
      - admin_node_modules_cache:/var/www/html/node_modules
    environment:
      DB_CONTAINER: "mysql"
      DB_HOST: "db"
      DB_PORT: 3306
      DB_DATABASE: "pens_admin_us"
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ""
      MYSQL_HOST: "db"
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: "pens_admin_us"
    depends_on:
      - db
    networks:
      pens_network:
        ipv4_address: 172.25.0.20
        aliases:
          - admin.pens.com

  db:
    image: mysql:8.0
    container_name: ${DB_CONTAINER}
    restart: unless-stopped
    command: --sql-mode="ALLOW_INVALID_DATES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      pens_network:
        ipv4_address: 172.25.0.30

volumes:
  db_data:
  vendor_cache:
  node_modules_cache:
  admin_vendor_cache:
  admin_node_modules_cache:
  admin_web_vendor_cache:
  admin_web_node_modules_cache:

networks:
  pens_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
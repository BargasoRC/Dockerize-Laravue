services:
  app:
    build:
      context: ${SOURCE_LOCATION}/.
      dockerfile: ../Dockerize-Laravue/Dockerfile.client
    container_name: ${WEB_CONTAINER}
    ports:
      - "80:80"
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ${SOURCE_LOCATION}:/var/www/html
      - vendor_cache:/var/www/html/vendor # Named volume for vendor
      - node_modules_cache:/var/www/html/node_modules # Named volume for vendor
    environment:
      DB_CONTAINER: "mysql"
      DB_HOST: "db"
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ""
      # Admin container communication  
      ADMIN_HOST: "admin.pens.com"
      ADMIN_PORT: "443"
      ADMIN_URL: "https://admin.pens.com"
    depends_on:
      - db
    networks:
      pens_network:
        aliases:
          - pensclient.localhost
          - ns-pens.dev.pensclient.localhost

  admin:
    build:
      context: ${ADMIN_WEB_SOURCE_LOCATION}/.
      dockerfile: ../Dockerize-Laravue/Dockerfile.adminweb
    container_name: ${ADMIN_WEB_CONTAINER}
    ports:
      - "81:80"
      - "443:443"
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ${ADMIN_WEB_SOURCE_LOCATION}:/var/www/html
      - admin_web_vendor_cache:/var/www/html/vendor
      - admin_web_node_modules_cache:/var/www/html/node_modules
    environment:
      DB_CONTAINER: "mysql"
      # Application settings
      APP_NAME: "PENS Admin"
      APP_ENV: "local"
      APP_DEBUG: "true"
      APP_URL: "https://admin.pens.com"
      # Database configuration
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: 3306
      DB_DATABASE: ${ADMIN_DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ""
      # Client container communication
      CLIENT_HOST: "ns-pens.dev.pensclient.localhost"
      CLIENT_PORT: "80"
      CLIENT_URL: "http://ns-pens.dev.pensclient.localhost"
      CLIENT_BASE_DOMAIN: "pensclient.localhost"
      CLIENT_DEV_DOMAIN: "ns-pens.dev.pensclient.localhost"
    depends_on:
      - db
    networks:
      pens_network:
        aliases:
          - admin.pens.com

  # Legacy admin service (commented out - uncomment if needed)
  # admin_legacy:
  #   build:
  #     context: ${ADMIN_SOURCE_LOCATION}/.
  #     dockerfile: ../Dockerize-Laravue/Dockerfile.admin
